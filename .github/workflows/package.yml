name: Package and Release

on:
  release:
    types: [published]

jobs:
  build-and-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Determine project to package
        id: prep
        run: |
          TAG_NAME="${{ github.event.release.tag_name }}"
          if [[ $TAG_NAME == filtering-* ]]; then
            echo "project_path=Mjolnir.Extensions.AspNetCore.Filtering/Mjolnir.Extensions.AspNetCore.Filtering.csproj" >> $GITHUB_OUTPUT
            echo "version=${TAG_NAME#filtering-}" >> $GITHUB_OUTPUT
            echo "package_name=filtering" >> $GITHUB_OUTPUT
          elif [[ $TAG_NAME == railway-* ]]; then
            echo "project_path=Mjolnir.Extensions.Railway/Mjolnir.Extensions.Railway.csproj" >> $GITHUB_OUTPUT
            echo "version=${TAG_NAME#railway-}" >> $GITHUB_OUTPUT
            echo "package_name=railway" >> $GITHUB_OUTPUT
          else
            echo "::error::Release tag '$TAG_NAME' does not match expected format (filtering-* or railway-*)"
            exit 1
          fi

      - name: Restore dependencies
        run: dotnet restore ${{ steps.prep.outputs.project_path }}

      - name: Build
        run: dotnet build ${{ steps.prep.outputs.project_path }} --configuration Release --no-restore

      - name: Pack
        run: |
          dotnet pack ${{ steps.prep.outputs.project_path }} \
            --configuration Release \
            --no-build \
            -p:PackageVersion=${{ steps.prep.outputs.version }} \
            --output nupkgs

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages-${{ steps.prep.outputs.package_name }}
          path: nupkgs/*.nupkg

      - name: Publish to NuGet.org
        run: |
          dotnet nuget push nupkgs/*.nupkg \
            --api-key ${{ secrets.NUGET_API_KEY }} \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
